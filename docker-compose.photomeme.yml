# MeMeGo 独立编排（最轻量部署：Redis + memego）。
# 首次上线：
#   docker network create imagine-net 2>/dev/null; \
#   docker compose --env-file .env.photomeme -f docker-compose.photomeme.yml up -d --build
#
# ⚠️ 反代方案：**用宿主机 nginx，不用 Caddy**。
#   生产机 159.223.116.111 的 80/443 已被宿主 nginx 占用（承载 ainews /
#   plays.jiandengcun.com / tools.jiandengcun.com 三个站点），Caddy 无法绑端口。
#   故本编排只把 memego 发布到 127.0.0.1:3100，由 nginx 反代。
#   配套 nginx 站点配置见 deploy/nginx/memego.jiandengcun.com.conf
#   （docker-compose.proxy.memego.yml 与 deploy/Caddyfile.memego 为备选路径，
#     在不与既有 nginx 冲突的环境才可用）
#
# 存储：生产推荐在 .env.photomeme 配置 R2_*（免挂载卷、免出口流量）；
#       使用本地存储时设 LOCAL_STORAGE_DIR=/data/storage，下方卷已挂载好。
#
# 分享图片 7 天清理（每天 04:30，宿主机 crontab）：
#   30 4 * * * docker exec memego pnpm cleanup:shares >> /var/log/memego-cleanup.log 2>&1

services:
  redis:
    image: redis:7-alpine
    container_name: memego-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    # redis-cli 读取 REDISCLI_AUTH 自动认证：既避免密码出现在 argv（ps 可见），
    # 也避免 -a 的告警污染 healthcheck 的 stdout。缺这个变量时健康检查会拿到
    # NOAUTH 而误判容器不健康（redis-server 其实是好的）。
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - memego-redis-data:/data
    networks:
      - imagine-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  memego:
    build:
      context: .
      dockerfile: apps/app-photomeme/Dockerfile
      # NEXT_PUBLIC_* 是构建期内联变量，必须走 build args 注入，
      # 否则静态页会退化为 http://localhost:3001 的 canonical / OG / sitemap
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_PADDLE_PRICE_ID: ${NEXT_PUBLIC_PADDLE_PRICE_ID:-}
        NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN:-}
    image: memego:local
    container_name: memego
    # 只发布到宿主机环回地址，由宿主机 nginx 反代。
    # 本机 80/443 已被 nginx 占用（承载 ainews / plays / tools 等站点），
    # 故不用 Caddy；3001 也已被 AI-News 后端占用，宿主机侧改用 3100。
    ports:
      - '127.0.0.1:3100:3001'
    env_file:
      - .env.photomeme
    volumes:
      - memego-storage-data:/data/storage
    restart: unless-stopped
    networks:
      - imagine-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  imagine-net:
    name: imagine-net
    external: true

volumes:
  memego-redis-data:
  memego-storage-data:
