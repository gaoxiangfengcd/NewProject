  <!-- brows -->
  <path d="M243 322 Q263 310 283 318" stroke="#2E2A33" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M317 318 Q337 310 357 322" stroke="#2E2A33" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- closed eyes -->
  <path d="M248 352 Q264 364 282 354" stroke="#4A3A31" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M318 354 Q336 364 352 352" stroke="#4A3A31" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- nose -->
