      <stop offset="0" stop-color="#F4F1FF"/>
      <stop offset="1" stop-color="#E7E1FF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="330" r="190" fill="#FFFFFF" opacity="0.5"/>
  <!-- torso -->
  <path d="M130 800 C130 655 205 600 300 600 C395 600 470 655 470 800 Z" fill="#7C5CE0"/>
  <!-- neck -->
