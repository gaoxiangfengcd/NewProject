  <ellipse cx="357" cy="398" rx="15" ry="8" fill="#E89180" opacity="0.3"/>
  <!-- two-block: crown -->
  <ellipse cx="300" cy="248" rx="110" ry="64" fill="#2E2A33"/>
  <!-- two-block: fringe -->
  <rect x="204" y="250" width="192" height="54" rx="26" fill="#2E2A33"/>
  <!-- two-block: side blocks -->
  <rect x="182" y="258" width="38" height="148" rx="19" fill="#2E2A33"/>
  <rect x="380" y="258" width="38" height="148" rx="19" fill="#2E2A33"/>
