<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF2FA"/>
      <stop offset="1" stop-color="#F8E4F5"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="330" r="190" fill="#FFFFFF" opacity="0.5"/>
  <!-- torso -->
  <path d="M130 800 C130 655 205 600 300 600 C395 600 470 655 470 800 Z" fill="#9D5BC7"/>
  <!-- neck -->
  <rect x="272" y="470" width="56" height="105" rx="24" fill="#EBB584"/>
  <!-- back hair mass (jaw-length bob) -->
  <ellipse cx="300" cy="330" rx="140" ry="145" fill="#4A2F27"/>
  <!-- face -->
  <ellipse cx="300" cy="345" rx="102" ry="118" fill="#F5CDA9"/>
  <!-- brows -->
  <path d="M243 322 Q263 310 283 318" stroke="#4A2F27" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M317 318 Q337 310 357 322" stroke="#4A2F27" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- closed eyes -->
  <path d="M248 352 Q264 364 282 354" stroke="#4A3A31" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M318 354 Q336 364 352 352" stroke="#4A3A31" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M298 368 Q290 392 302 398" stroke="#E0A473" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- lips -->
  <path d="M284 428 Q300 440 316 428" stroke="#C05B57" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="243" cy="398" rx="15" ry="8" fill="#E89180" opacity="0.4"/>
  <ellipse cx="357" cy="398" rx="15" ry="8" fill="#E89180" opacity="0.4"/>
  <!-- bob: crown -->
  <ellipse cx="300" cy="245" rx="112" ry="58" fill="#4A2F27"/>
  <!-- bob: curtain fringe -->
  <rect x="206" y="252" width="188" height="50" rx="24" fill="#4A2F27"/>
  <!-- bob: side curtains -->
  <rect x="176" y="268" width="50" height="160" rx="24" fill="#4A2F27"/>
  <rect x="374" y="268" width="50" height="160" rx="24" fill="#4A2F27"/>
  <!-- highlights -->
  <path d="M240 355 Q225 405 240 450" stroke="#FFFFFF" stroke-width="6" fill="none" opacity="0.1" stroke-linecap="round"/>
  <path d="M360 355 Q375 405 360 450" stroke="#FFFFFF" stroke-width="6" fill="none" opacity="0.1" stroke-linecap="round"/>
</svg>
