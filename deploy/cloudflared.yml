# Cloudflare Tunnel 模式：VPS 无需公网 IP、无需开放任何端口。
# Cloudflare 边缘终结 TLS，隧道回连 VPS 直接路由到容器。
#
# 准备步骤（一次性）：
#   1. Cloudflare Dashboard → Zero Trust → Networks → Tunnels → Create Tunnel
#   2. 选择 Cloudflared，拿到 Tunnel Token
#   3. 在 Tunnel 的 Public Hostnames 中配置：
#        jiandengcun.com        → http://app-official:3002
#        memego.jiandengcun.com → http://memego:3001
#        hair.example.com       → http://app-web:3000
#   4. 将 Tunnel Token 填入 .env.proxy 的 CLOUDFLARE_TUNNEL_TOKEN
#
# 启动（替代 Caddy）：
#   docker compose --env-file .env.proxy -f deploy/cloudflared.yml up -d
#
# 注意：此模式下 Caddy 容器不需要启动。DNS 记录由 Cloudflare Tunnel 自动创建（CNAME）。

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: imagine-cloudflared
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - imagine-net
    depends_on: []

networks:
  imagine-net:
    name: imagine-net
    external: true
