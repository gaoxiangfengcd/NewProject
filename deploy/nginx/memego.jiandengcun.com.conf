# MeMeGo 站点 —— 宿主机 nginx 反代到 Docker 容器
#
# 为什么不用 Caddy：生产机 159.223.116.111 的 80/443 已由宿主机 nginx 统一承载
#   （已有 ainews / plays.jiandengcun.com / tools.jiandengcun.com 三个站点在跑），
#   Caddy 无法绑定端口。故改为 nginx 反代，
#   memego 容器经 docker-compose.photomeme.yml 发布到 127.0.0.1:3100。
#
# 部署步骤（服务器上）：
#   cp 本文件 → /etc/nginx/sites-available/memego.jiandengcun.com
#   ln -s /etc/nginx/sites-available/memego.jiandengcun.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d memego.jiandengcun.com
#
# TLS：本文件只监听 80，证书由 certbot 自动补上（listen 443 ssl、证书路径、
#   HTTP→HTTPS 跳转块），与 tools.jiandengcun.com 的写法保持一致。
#   ⚠️ 跑 certbot 前，Cloudflare 里该记录必须是「灰云 / DNS only」，
#      否则 Always Use HTTPS 会让 ACME 的 http-01 校验陷入跳转循环。
#     证书签发成功后再切回橙云。

server {
    listen 80;
    server_name memego.jiandengcun.com;

    # 应用侧限制单图 10 MB（apps/app-photomeme/src/lib/validation.ts 的
    # MAX_IMAGE_BYTES），nginx 默认仅 1m，不放开会在上传时直接 413。
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 图片生成是长请求（等上游模型出图，实测 20~30s），
        # nginx 默认 60s 会中途掐断连接。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
